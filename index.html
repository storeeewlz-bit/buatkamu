<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surat Untukmu ❤️</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #ffe0b2 50%, #f8bbd0 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .font-romantic {
            font-family: 'Dancing Script', cursive;
        }
        /* Pulse Animation for Heart */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.15); }
            28% { transform: scale(1); }
            42% { transform: scale(1.15); }
            70% { transform: scale(1); }
        }
        .animate-heartbeat {
            animation: heartbeat 1.5s infinite;
        }
        /* Glassmorphism Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        /* Floating particles background */
        .particle {
            position: absolute;
            pointer-events: none;
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.4; }
        }
        /* Typing cursor effect */
        .typing-cursor::after {
            content: '|';
            animation: blink 0.7s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 relative">

    <!-- Background Floating Hearts Decorative -->
    <div class="particle top-10 left-10 text-pink-300 text-2xl"><i class="fas fa-heart"></i></div>
    <div class="particle top-1/4 right-12 text-red-300 text-3xl" style="animation-delay: 1s;"><i class="fas fa-heart"></i></div>
    <div class="particle bottom-10 left-1/3 text-pink-400 text-xl" style="animation-delay: 2s;"><i class="fas fa-heart"></i></div>
    <div class="particle bottom-20 right-10 text-red-200 text-4xl" style="animation-delay: 3s;"><i class="fas fa-heart"></i></div>

    <!-- Background Music Audio Element -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://mp3tourl.com/audio/1793639491162-4081d5b2-5677-44d0-aaa5-855a7bbfd7d9.mp3" type="audio/mp3">
        Browser Anda tidak mendukung elemen audio.
    </audio>

    <!-- Floating Audio Control Button -->
    <button id="musicToggle" onclick="toggleMusic()" class="hidden fixed top-5 right-5 z-50 bg-white/80 backdrop-blur border border-pink-300 text-pink-600 p-3 rounded-full shadow-lg hover:bg-pink-50 transition duration-300 flex items-center gap-2">
        <i id="musicIcon" class="fas fa-music animate-spin"></i>
        <span id="musicText" class="text-xs font-semibold pr-1">Musik On</span>
    </button>

    <!-- 1. INITIAL SCREEN: Centered Heart Button -->
    <div id="startScreen" class="text-center z-10 transition-all duration-500 transform">
        <p class="text-pink-600 font-medium mb-6 tracking-wide animate-bounce text-sm sm:text-base">Pencet Love nya ya ✨</p>
        <button onclick="openLetter()" class="group relative outline-none focus:outline-none">
            <div class="w-28 h-28 sm:w-36 sm:h-36 bg-gradient-to-tr from-pink-500 to-red-400 rounded-full flex items-center justify-center shadow-2xl animate-heartbeat group-hover:scale-110 transition duration-300 cursor-pointer">
                <i class="fas fa-heart text-5xl sm:text-6xl text-white drop-shadow-md"></i>
            </div>
            <!-- Ripple Effect -->
            <div class="absolute inset-0 rounded-full bg-pink-400 opacity-30 animate-ping pointer-events-none"></div>
        </button>
    </div>

    <!-- 1.5. TYPING INTRO SCREEN -->
    <div id="introScreen" class="hidden text-center z-10 transition-all duration-500 transform">
        <div class="glass-card px-8 py-6 rounded-2xl shadow-xl border border-pink-200">
            <p id="typingIntroText" class="font-romantic text-2xl sm:text-4xl text-pink-600 font-bold typing-cursor"></p>
        </div>
    </div>

    <!-- 2. LETTER MODAL / CARD -->
    <div id="letterCard" class="hidden z-20 w-full max-w-lg transition-all duration-700 transform scale-95 opacity-0">
        <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl text-gray-800 relative border-2 border-pink-200">
            
            <!-- Letter Header -->
            <div class="text-center mb-6 border-b border-pink-100 pb-4">
                <i class="fas fa-envelope-open-text text-3xl text-pink-500 mb-2"></i>
                <h1 class="font-romantic text-3xl sm:text-4xl text-pink-600 font-bold">Untuk Kamu ❤️</h1>
            </div>

            <!-- Letter Content Area (Typed via JS) -->
            <div class="space-y-4 text-sm sm:text-base leading-relaxed text-gray-700 text-center sm:text-left min-h-[160px]">
                <p id="line1" class="opacity-0"></p>
                <p id="line2" class="opacity-0"></p>
                <p id="line3" class="opacity-0"></p>
                <p id="line4" class="font-semibold text-pink-600 text-right mt-4 opacity-0"></p>
            </div>

            <!-- Tombol "Udah Baca Pesannya?" -->
            <div id="readConfirmSection" class="mt-8 pt-6 border-t border-pink-100 text-center opacity-0 transition-opacity duration-700 hidden">
                <p class="font-romantic text-xl sm:text-2xl font-bold text-gray-800 mb-4">
                    Udah baca pesannya? 💌
                </p>
                <button onclick="goToApologyPage()" class="bg-gradient-to-r from-pink-500 to-red-500 hover:from-pink-600 hover:to-red-600 text-white font-semibold px-8 py-3 rounded-full shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition duration-200">
                    Udah ✨
                </button>
            </div>

        </div>
    </div>

    <!-- 3. APOLOGY & FINAL QUESTION PAGE -->
    <div id="apologyCard" class="hidden z-20 w-full max-w-lg transition-all duration-700 transform scale-95 opacity-0">
        <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl text-gray-800 relative border-2 border-pink-200 text-center">
            
            <div class="mb-4">
                <i class="fas fa-heart-broken text-3xl text-pink-500 mb-2 animate-bounce"></i>
                <h1 class="font-romantic text-3xl sm:text-4xl text-pink-600 font-bold">Maafin Aku Ya 🥺</h1>
            </div>

            <!-- Apology Text Typed via JS -->
            <div class="min-h-[80px] my-6 flex items-center justify-center">
                <p id="apologyText" class="text-base sm:text-lg text-gray-700 font-medium"></p>
            </div>

            <!-- Question & Options Section -->
            <div id="finalQuestionSection" class="mt-6 pt-6 border-t border-pink-100 opacity-0 transition-opacity duration-700 hidden">
                <p class="font-romantic text-2xl sm:text-3xl font-bold text-gray-800 mb-8">
                    Apakah kamu maafin aku? 🥺
                </p>

                <!-- Buttons Row (Diperbaiki agar tombol "Engga" tampil berdampingan secara rapi sebelum kabur) -->
                <div class="flex items-center justify-center gap-6 min-h-[70px] relative">
                    <!-- Option "Iyaa" -->
                    <button onclick="goToWhatsapp()" class="bg-gradient-to-r from-pink-500 to-red-500 hover:from-pink-600 hover:to-red-600 text-white font-semibold px-8 py-3 rounded-full shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition duration-200 flex items-center gap-2 z-10">
                        <i class="fas fa-heart"></i> Iyaa
                    </button>

                    <!-- Option "Engga" (Kabur-kaburan) -->
                    <button id="btnEngga" 
                            onmouseenter="moveButton()" 
                            ontouchstart="moveButton()" 
                            onclick="moveButton()" 
                            class="bg-gray-200 hover:bg-gray-300 text-gray-600 font-semibold px-6 py-3 rounded-full shadow transition-all duration-200 z-10">
                        Engga 😜
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const WHATSAPP_NUMBER = "6285166493549"; 
        const WHATSAPP_MESSAGE = "Iyaa sayang, aku maafin kok! Jangan diulangi lagi ya ❤️🥰";

        const bgMusic = document.getElementById('bgMusic');
        const musicToggle = document.getElementById('musicToggle');
        const musicIcon = document.getElementById('musicIcon');
        const musicText = document.getElementById('musicText');

        const introTextString = "Dengerin lagunya sambil bacanya ya... 🎵✨";
        let charIndex = 0;

        function typeIntro() {
            if (charIndex < introTextString.length) {
                document.getElementById('typingIntroText').innerHTML += introTextString.charAt(charIndex);
                charIndex++;
                setTimeout(typeIntro, 70);
            } else {
                setTimeout(() => {
                    const introScreen = document.getElementById('introScreen');
                    const letterCard = document.getElementById('letterCard');

                    introScreen.classList.add('opacity-0', 'scale-50');
                    setTimeout(() => {
                        introScreen.classList.add('hidden');
                        
                        letterCard.classList.remove('hidden');
                        setTimeout(() => {
                            letterCard.classList.remove('scale-95', 'opacity-0');
                            letterCard.classList.add('scale-100', 'opacity-100');
                            startTypingLetter();
                        }, 50);
                    }, 500);
                }, 1500);
            }
        }

        const letterLines = [
            "Halo Sayang,",
            "Terima kasih ya sudah hadir dan mewarnai hari-hariku. Bersamamu semuanya terasa jauh lebih tenang dan membahagiakan.",
            "Aku buatkan halaman kecil ini khusus untukmu, sebagai pengingat betapa berartinya kamu buat aku. Semoga harimu menyenangkan terus ya!",
            "- Dari yang selalu mencintaimu"
        ];

        function typeLine(lineId, text, callback) {
            const element = document.getElementById(lineId);
            element.classList.remove('opacity-0');
            element.classList.add('typing-cursor');
            let i = 0;

            function typing() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(typing, 40);
                } else {
                    element.classList.remove('typing-cursor');
                    if (callback) callback();
                }
            }
            typing();
        }

        function startTypingLetter() {
            typeLine('line1', letterLines[0], () => {
                typeLine('line2', letterLines[1], () => {
                    typeLine('line3', letterLines[2], () => {
                        typeLine('line4', letterLines[3], () => {
                            const readConfirm = document.getElementById('readConfirmSection');
                            readConfirm.classList.remove('hidden');
                            setTimeout(() => {
                                readConfirm.classList.remove('opacity-0');
                            }, 50);
                        });
                    });
                });
            });
        }

        function goToApologyPage() {
            const letterCard = document.getElementById('letterCard');
            const apologyCard = document.getElementById('apologyCard');

            letterCard.classList.add('opacity-0', 'scale-50');
            setTimeout(() => {
                letterCard.classList.add('hidden');
                
                apologyCard.classList.remove('hidden');
                setTimeout(() => {
                    apologyCard.classList.remove('scale-95', 'opacity-0');
                    apologyCard.classList.add('scale-100', 'opacity-100');
                    startTypingApology();
                }, 50);
            }, 500);
        }

        const apologyString = "aku minta maaf udah bikin kamu gaa mood yaa maafin yaa";
        let apologyIdx = 0;

        function startTypingApology() {
            const apologyElem = document.getElementById('apologyText');
            apologyElem.classList.add('typing-cursor');

            function typeApo() {
                if (apologyIdx < apologyString.length) {
                    apologyElem.innerHTML += apologyString.charAt(apologyIdx);
                    apologyIdx++;
                    setTimeout(typeApo, 50);
                } else {
                    apologyElem.classList.remove('typing-cursor');
                    const finalQ = document.getElementById('finalQuestionSection');
                    finalQ.classList.remove('hidden');
                    setTimeout(() => {
                        finalQ.classList.remove('opacity-0');
                    }, 50);
                }
            }
            typeApo();
        }

        // Fungsi Tombol "Engga" Kabur-kaburan (Random Position)
        function moveButton() {
            const btn = document.getElementById('btnEngga');
            const randomX = Math.floor(Math.random() * 200) - 100; // -100px sampai 100px
            const randomY = Math.floor(Math.random() * 120) - 60;  // -60px sampai 60px
            
            btn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        function openLetter() {
            const startScreen = document.getElementById('startScreen');
            const introScreen = document.getElementById('introScreen');

            startScreen.classList.add('opacity-0', 'scale-50');
            setTimeout(() => {
                startScreen.classList.add('hidden');
                introScreen.classList.remove('hidden');
                typeIntro();
            }, 500);

            bgMusic.play().then(() => {
                musicToggle.classList.remove('hidden');
            }).catch(error => {
                console.log("Autoplay ditahan browser, musik dimainkan via interaksi.");
                musicToggle.classList.remove('hidden');
            });
        }

        function toggleMusic() {
            if (bgMusic.paused) {
                bgMusic.play();
                musicIcon.classList.add('animate-spin');
                musicText.innerText = "Musik On";
            } else {
                bgMusic.pause();
                musicIcon.classList.remove('animate-spin');
                musicText.innerText = "Musik Off";
            }
        }

        function goToWhatsapp() {
            const encodedMsg = encodeURIComponent(WHATSAPP_MESSAGE);
            const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMsg}`;
            window.open(waUrl, '_blank');
        }
    </script>
</body>
</html>
